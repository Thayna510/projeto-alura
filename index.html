<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa de Itens</title>
    <style>
        /* Estilos CSS */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 20px;
            color: #333333;
            text-align: center;
        }

        #searchBox {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-bottom: 20px;
            outline: none;
            transition: border-color 0.3s;
        }

        #searchBox:focus {
            border-color: #007bff;
        }

        #itemList {
            list-style: none;
        }

        .item {
            padding: 10px 12px;
            background: #f9f9f9;
            border: 1px solid #e1e1e1;
            margin-bottom: 8px;
            border-radius: 5px;
            color: #444;
            transition: background 0.2s;
        }

        .item:hover {
            background: #f1f1f1;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Buscar Item</h1>
        <input type="text" id="searchBox" placeholder="Digite para pesquisar...">
        
        <ul id="itemList">
            <li class="item">Maçã</li>
            <li class="item">Banana</li>
            <li class="item">Laranja</li>
            <li class="item">Uva</li>
            <li class="item">Morango</li>
            <li class="item">Abacaxi</li>
            <li class="item">Manga</li>
        </ul>
    </div>

    <script>
        /* Código JavaScript */
        const searchBox = document.getElementById('searchBox');
        const items = document.querySelectorAll('.item');

        searchBox.addEventListener('input', function() {
            const term = searchBox.value.toLowerCase();

            items.forEach(item => {
                const text = item.textContent.toLowerCase();
                if (text.includes(term)) {
                    item.style.display = 'block';
                } else {
                    item.style.display = 'none';
                }
            });
        });
    </script>

</body>
</html>
